<main class="flex flex-direction-column">
    <!--header-->
    <div class="width-full height-100 blue"></div>
    <div class="flex flex-direction-column center">
        <div class="width-full max-width-1000 margin-top-16">
            <!--recap du mois en affichage-->
            <div class="Section flex center flex-direction-column">

                <div class="flex center margin-bottom-16 white">
                    <button class="Button margin-right-16"><</button>
                    <div class="margin-right-16">octobre 2026</div>
                    <button class="Button margin-right-16">></button>
                </div>

                <!--recap du mois en affichage-->
                <div class="flex-direction-row padding-8">
                    <!--recap heures-->
                    <div class="flex center">
                        <div class="margin-right-16">Cumul heures </div>
                        <div class="valeur">30:15</div>
                    </div>
                    <!--recap euros-->
                    <div class="flex center">
                        <div class="margin-right-16">Cumul euros </div>
                        <div class="valeur">300,15</div>
                    </div>

                </div>

            </div>

            <!--calendrier-->
            <div class="Section flex center margin-top-16 gray">

                <mat-card class="demo-inline-calendar-card">
                    <mat-calendar [(selected)]="selected"></mat-calendar>
                </mat-card>

            </div>
            <!--saisi du jour-->
            <div class="margin-top-16 height-300 purple"></div>


        </div>
    </div>

</main>
